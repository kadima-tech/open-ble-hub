[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openble-muse"
version = "0.1.0"
description = "Interaxon Muse EEG headband BLE protocol: command framing, JSON replies, the three data layouts and a command link, without a Bluetooth stack."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kadima Tech" }]
keywords = ["bluetooth", "ble", "muse", "eeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Source = "https://github.com/kadima-tech/open-ble-hub/tree/main/packages/openble-muse"
Issues = "https://github.com/kadima-tech/open-ble-hub/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openble"]
