name: Publish protocol catalog

on:
  pull_request:
    paths: ['catalog/**', 'scripts/catalog.py', 'scripts/test_catalog.py', 'packages/**', 'docs/**', '.github/workflows/catalog.yml']
  push:
    branches: [main]
    paths: ['catalog/**', 'scripts/catalog.py', 'scripts/test_catalog.py', 'packages/**', 'docs/**', '.github/workflows/catalog.yml']
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  release:
    types: [published]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: protocol-catalog-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s scripts -p 'test_catalog.py'
      - run: python3 scripts/catalog.py

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.tag_name != 'catalog-v1'))
    needs: validate
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Export catalog and current issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/catalog.py --ensure-labels --issues
      - name: Publish the versioned feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view catalog-v1 >/dev/null 2>&1; then
            gh release create catalog-v1 --target main --title 'Protocol catalog v1' --notes 'Machine-readable protocol and device catalog. Managed by the catalog workflow.' --latest=false
          fi
          gh release upload catalog-v1 dist/catalog/v1/catalog.json catalog/schema.json --clobber
