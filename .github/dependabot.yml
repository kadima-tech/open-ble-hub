version: 2
updates:
  - package-ecosystem: pip
    # Runtime dependencies live in each app's pyproject.toml. The libraries
    # have none.
    directories:
      - /apps/bathroom-hub
      - /apps/ble-probe
    schedule:
      interval: weekly
      day: monday
    # Version updates are batched into a weekly PR. Limit 0 stops Dependabot
    # from opening version PRs; security alerts still run.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Version updates are batched into a weekly PR. Limit 0 stops Dependabot
    # from opening version PRs; security alerts still run.
    open-pull-requests-limit: 0
