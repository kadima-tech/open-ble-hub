version: 2
updates:
  - package-ecosystem: pip
    # Runtime dependencies live in each app's pyproject.toml. The libraries
    # have none.
    directories:
      - /apps/bathroom-hub
      - /apps/ble-probe
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
